<section class="bg-night-950 px-4 py-5 sm:px-8" aria-labelledby="minijuego-titulo">
  <div class="franja mx-auto flex max-w-3xl items-center gap-4 p-3 sm:gap-6 sm:p-4">
    <!-- Vista previa armada con los assets del juego -->
    <div class="vista" aria-hidden="true">
      <img class="vista-fondo" src="images/juego/fondo.webp" alt="" loading="lazy" />
      <img class="vista-corazon" src="images/efectos/corazon.webp" alt="" loading="lazy" />
      <img class="vista-muneca" src="images/muneca/correr-3.webp" alt="" loading="lazy" />
    </div>

    <div class="min-w-0 flex-1">
      <h2 id="minijuego-titulo" class="font-display text-3xl leading-none text-neon-400 sm:text-4xl">
        Mini Juego <span class="text-2xl text-neon-300" aria-hidden="true">✦</span>
      </h2>
      <p class="mt-1 font-hand text-xl text-neon-200 sm:text-2xl">Atrapa los corazones ♡</p>
    </div>

    <button #boton type="button" class="jugar" (click)="abrir()">
      <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z" />
      </svg>
      Jugar
    </button>
  </div>
</section>

@if (abierto()) {
  @defer (on immediate) {
    <app-game (cerrar)="cerrar()" />
  }
}
