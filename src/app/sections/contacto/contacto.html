<section
  id="contacto"
  class="relative overflow-hidden bg-linear-to-b from-night-900 to-night-950 px-4 pt-24 pb-12 sm:px-8"
>
  <div class="mx-auto max-w-5xl">
    <h2 class="font-display text-6xl text-neon-400 sm:text-7xl" data-reveal>
      ¿Hablamos? <span class="text-4xl text-neon-300" aria-hidden="true">✦</span>
    </h2>
    <span class="mt-2 block h-0.5 w-28 rounded-full bg-neon-400/70" aria-hidden="true"></span>

    <!-- Tarjeta de borde punteado -->
    <div
      class="tarjeta mt-12 grid items-center gap-10 p-6 sm:p-10 md:grid-cols-[minmax(0,1fr)_16rem]"
      data-reveal
    >
      <!-- Muñeca (arriba en móvil, a la derecha en escritorio) -->
      <div class="relative order-first mx-auto w-full max-w-[220px] md:order-last md:max-w-[260px]">
        <img
          class="muneca-contacto w-full"
          src="images/muneca/laptop.webp"
          alt="Ange Rose sentada con su laptop"
          loading="lazy"
          decoding="async"
        />
        <img
          class="brillo b1"
          src="images/efectos/destello-1.webp"
          alt=""
          aria-hidden="true"
          loading="lazy"
        />
        <img
          class="brillo b2"
          src="images/efectos/destello-3.webp"
          alt=""
          aria-hidden="true"
          loading="lazy"
        />
      </div>

      <div class="text-center md:text-left">
        <svg
          class="mx-auto size-9 text-neon-400 md:mx-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>

        <p class="mt-3 font-hand text-3xl leading-snug text-neon-200 sm:text-4xl">
          Estoy abierta a nuevos proyectos y oportunidades. ♡
        </p>

        <ul class="mt-8 flex flex-col gap-3 sm:flex-row sm:flex-wrap md:justify-start">
          @for (red of redes; track red.nombre) {
            <li>
              <a
                class="red"
                [href]="red.href"
                [attr.target]="red.externo ? '_blank' : null"
                [attr.rel]="red.externo ? 'noopener noreferrer' : null"
                [attr.aria-label]="red.externo ? red.nombre + ' (se abre en una pestaña nueva)' : 'Escribirme un correo'"
              >
                <svg
                  class="size-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  @switch (red.icono) {
                    @case ('mail') {
                      <rect x="2" y="4" width="20" height="16" rx="2" />
                      <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    }
                    @case ('github') {
                      <path
                        d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                      />
                      <path d="M9 18c-4.51 2-5-2-7-2" />
                    }
                    @case ('linkedin') {
                      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
                      <rect x="2" y="9" width="4" height="12" />
                      <circle cx="4" cy="4" r="2" />
                    }
                    @case ('whatsapp') {
                      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                    }
                  }
                </svg>
                {{ red.nombre }}
              </a>
            </li>
          }
        </ul>

        <a
          class="cta mt-8"
          [href]="correoPrincipal"
        >
          Contáctame
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>

<footer
  class="flex flex-col items-center justify-between gap-2 bg-night-950 px-4 py-6 text-sm text-neon-200/80 sm:flex-row sm:px-8"
>
  <p><span class="text-neon-400" aria-hidden="true">♡</span> Gracias por visitar mi portafolio <span class="text-neon-400" aria-hidden="true">♡</span></p>
  <p>Hecho con <span class="text-neon-400" aria-hidden="true">♡</span> y mucho código <span aria-hidden="true">&lt;/&gt;</span></p>
</footer>
